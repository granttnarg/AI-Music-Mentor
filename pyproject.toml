[project]
name = "ai-music-mentor"
version = "0.1.0"
description = "AI Feedback Mentor for Music Production using LLM/RAG and Librosa Feature Extraction"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "black>=25.1.0",
    "chatollama>=0.2.13",
    "langchain>=0.3.27",
    "langchain-ollama>=0.3.8",
    "langchain-postgres>=0.0.15",
    "langsmith>=0.4.27",
    "librosa>=0.11.0",
    "numpy>=1.26.0,<2.0.0",
    "psycopg2-binary>=2.9.10",
    "pytest>=8.4.2",
    "python-dotenv>=1.1.1",
    "scikit-learn>=1.7.2",
    "streamlit>=1.49.1",
    "tensorflow==2.19.0",
    "keras==3.10.0",
    "pydub>=0.25.1",
    "matplotlib>=3.10.6",
    "plotly>=5.17.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.17",
    "pydantic>=2.10.0",
    "httpx>=0.28.1",
]
